[project]
name = "northwind-backend"
version = "0.1.0"
description = "Back-end for the Northwind support chat: FastAPI + a LangGraph agent on Gemini"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Raised inside google-genai on Python 3.14; not ours to fix.
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make the alembic package look first-party.
known-third-party = ["alembic"]
